server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://host.docker.internal:3100/loki/api/v1/push

scrape_configs:
  - job_name: petclinic-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: spring-petclinic
          __path__: /var/log/app.log
